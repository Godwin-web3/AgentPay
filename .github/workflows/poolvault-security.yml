name: PoolVault security tests

on:
  push:
    branches:
      - main
      - security/poolvault-authorization-hardening
  pull_request:
    paths:
      - "contracts/**"
      - "test/PoolVault.test.js"
      - "hardhat.config.js"
      - "package.json"

permissions:
  contents: write

jobs:
  poolvault:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node scripts/compile.js
      - run: npx hardhat test test/PoolVault.test.js
      - name: Commit regenerated PoolVault artifact
        run: |
          if ! git diff --quiet -- artifacts/PoolVault.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add artifacts/PoolVault.json
            git commit -m 'build: regenerate PoolVault artifact [skip ci]'
            git push
          fi

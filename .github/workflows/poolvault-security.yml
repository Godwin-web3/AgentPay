name: PoolVault security tests

on:
  push:
    branches:
      - main
      - security/poolvault-authorization-hardening
  pull_request:
    paths:
      - "contracts/**"
      - "test/PoolVault.test.js"
      - "hardhat.config.js"
      - "package.json"

jobs:
  poolvault:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx hardhat test test/PoolVault.test.js
